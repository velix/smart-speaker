[project]
name = "voice-assistant"
version = "0.1.0"
description = "Smart speaker daemon for Raspberry Pi 3B + ReSpeaker 2-Mic HAT, backed by remote OpenWebUI (STT → LLM → TTS)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "webrtcvad-wheels>=2.0.14",
    "gpiozero>=2.0",
    # Pi-only: these do not build/run off the Pi
    "spidev>=3.6; sys_platform == 'linux'",
    "RPi-GPIO>=0.7; sys_platform == 'linux'",
    "lgpio>=1.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
# openwakeword requires onnxruntime, which has no 32-bit armv7 wheels —
# it cannot install on the Pi 3B (bullseye 32-bit). Wake-word engine for the
# Pi will be Porcupine or a tflite-based approach instead.
wakeword = ["openwakeword>=0.6.0"]

[project.scripts]
voice-assistant = "voice_assistant.assistant:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
