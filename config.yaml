openwebui:
  # Secrets live OUTSIDE this repo (it is public). Set these in an untracked
  # config.local.yaml next to this file, or via OPENWEBUI_BASE_URL /
  # OPENWEBUI_API_KEY environment variables (see README).
  base_url: ""
  api_key: ""
  model: "jarvis"      # OpenWebUI workspace model — owns prompt/personality (ministral-8b-2512 base)
  server_chat: true    # Path A chat (chat_id+id+stream+session_id): the ONLY mode where
                       # OpenWebUI executes tools server-side — without it, workspace-model
                       # knowledge silently never triggers (docs: Server-Side Tool Calling)
  server_chat_timeout: 90   # seconds to wait for the server-side tool loop
  # OpenTerminal for voice turns — SECURITY-SENSITIVE: anyone within earshot
  # can trigger shell commands on the terminal server's machine. Opt-in:
  # set to the terminal id from OpenWebUI (Workspace → Terminals) to enable.
  # terminal_id: "3e4c0103-2a9f-4a50-a373-d66828b9ceb2"
  language: "en"

audio:
  card: 1            # 64-bit trixie + wm8960-soundcard overlay: 'card 1: wm8960soundcard'
  rate: 16000
  channels: 2        # WM8960 captures stereo; we slice channel 0
  playback_volume: 0.9

wake_word:
  enabled: true
  engine: "openwakeword"
  model: "hey_jarvis"
  threshold: 0.9

stt:
  engine: "ollama"      # A/B validated 2026-11-01: gemma4:e4b 0.32s/6-of-8 vs whisper-base 1.91s/5-of-8
  ollama:
    base_url: "http://192.168.2.139:11434/v1"
    model: "gemma4:e4b"   # audio-capable chat model, already on gpu-machine; warm ~0.3s, cold load ~43s
    keep_alive: "30m"     # keep the model in VRAM between turns — avoids the cold-load hit
    # Vocabulary hints: proper nouns gemma4 should recognize verbatim.
    # Add anything the recognizer mangles — hostnames, projects, people.
    hints: [fitlen, littlewyse, prox, proxmox, gpu-machine, app_server, unraid,
            Ollama, Kokoro, jarvis, Velisarios, deytes]
    # prompt: "Transcribe this audio. Reply with only the transcript."

vad:
  silence_ms: 600
  max_utterance_s: 12
  min_speech_ms: 200

button:
  enabled: true      # GPIO17 push-to-talk fallback / barge-in

tts:
  engine: "openai"         # A/B validated 2026-11-01: Kokoro GPU ~0.95s first-audio + clearly better voice; piper = fallback
  fallback: "piper"         # used if the primary engine fails
  openai:
    base_url: "http://192.168.2.139:8880/v1"   # Kokoro-FastAPI on gpu-machine (deployed as stack, definition in appdata)
    model: "kokoro"
    voice: "af_heart"
    sample_rate: 24000
  piper:
    voice: "/opt/piper/voices/en_US-lessac-low.onnx"  # engine = piper-tts wheel (aarch64)

health:
  enabled: true      # GET /health JSON endpoint for uptime-kuma
  port: 8310

history:
  max_turns: 10

server:
  system_prompt: "You are a voice assistant on a smart speaker. Reply in 1-2 short conversational sentences. Keep every sentence short: at most 10 words. No lists, no markdown."
  # The OpenWebUI workspace model "jarvis" owns the prompt/personality —
  # the daemon sends conversation turns only.
  send_system_prompt: false
  # Mechanical reply discipline: the workspace prompt holds for plain replies
  # but drifts on knowledge-tool turns (RAG chunks drown it) — over-budget
  # replies are compressed for speech by the warm STT model on the GPU.
  max_reply_words: 45   # 0 disables
