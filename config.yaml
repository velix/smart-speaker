openwebui:
  # Secrets live OUTSIDE this repo (it is public). Set these in an untracked
  # config.local.yaml next to this file, or via OPENWEBUI_BASE_URL /
  # OPENWEBUI_API_KEY environment variables (see README).
  base_url: ""
  api_key: ""
  model: "ministral-3b-2512"
  language: "en"

audio:
  card: 1            # 64-bit trixie + wm8960-soundcard overlay: 'card 1: wm8960soundcard'
  rate: 16000
  channels: 2        # WM8960 captures stereo; we slice channel 0
  playback_volume: 0.9

wake_word:
  enabled: true
  engine: "openwakeword"
  model: "hey_jarvis"
  threshold: 0.9

stt:
  engine: "openwebui"    # A/B switch: "openwebui" (whisper on app_server) | "ollama" (audio-capable model on gpu-machine)
  ollama:
    base_url: "http://192.168.2.139:11434/v1"
    model: "gemma4:e4b"   # audio-capable chat model, already on gpu-machine; warm ~0.3s, cold load ~43s
    keep_alive: "30m"     # keep the model in VRAM between turns — avoids the cold-load hit
    # prompt: "Transcribe this audio. Reply with only the transcript."

vad:
  silence_ms: 600
  max_utterance_s: 12
  min_speech_ms: 200

button:
  enabled: true      # GPIO17 push-to-talk fallback / barge-in

tts:
  engine: "piper"          # "piper" (on-Pi, local) or "openwebui" (server-side)
  piper:
    voice: "/opt/piper/voices/en_US-lessac-low.onnx"  # engine = piper-tts wheel (aarch64)

health:
  enabled: true      # GET /health JSON endpoint for uptime-kuma
  port: 8310

history:
  max_turns: 10

server:
  system_prompt: "You are a voice assistant on a smart speaker. Reply in 1-2 short conversational sentences. Keep every sentence short: at most 10 words. No lists, no markdown."
